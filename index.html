<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaxBase — Ascend Advisory Group</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4C7E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C1E26; --muted:#6B7180; --line:#E2E4E9; --bg:#F7F7F5;
    --navy:#2B4C7E; --navy-dark:#1F3A61; --red:#E03131;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:36px 32px;
  }
  .mark{
    width:40px; height:40px; margin-bottom:20px;
  }
  .mark img{width:100%; height:100%; display:block;}
  h1{font-size:20px; font-weight:600; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 28px;}
  label{display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:var(--ink);}
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-family:inherit; margin-bottom:16px; background:#fcfcfb;
  }
  input:focus{outline:none; border-color:var(--navy);}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:42px;}
  .eye-toggle{
    position:absolute; top:0; right:0; height:100%; width:40px; margin-bottom:16px;
    background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--muted); padding:0;
  }
  .eye-toggle:hover{color:var(--ink);}
  .eye-toggle svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .eye-toggle .eye-off{display:none;}
  button{
    width:100%; padding:11px; background:var(--navy); color:#fff; border:none;
    border-radius:7px; font-size:14px; font-weight:600; font-family:inherit;
    cursor:pointer; margin-top:6px;
  }
  button:hover{background:var(--navy-dark);}
  button:disabled{opacity:.6; cursor:default;}
  .error{
    background:#FFF0F0; border:1px solid #FFC9C9; color:var(--red);
    font-size:13px; padding:10px 12px; border-radius:7px; margin-bottom:16px; display:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="mark"><img src="icon.svg" alt="TaxBase"></div>
  <h1>TaxBase</h1>
  <p class="sub">Ascend Advisory Group — sign in with your registered account.</p>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <label for="staffId">Staff ID</label>
    <input type="text" id="staffId" required autocomplete="username" placeholder="e.g. ST1023">
    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" required autocomplete="current-password">
      <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
        <svg class="eye-on" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
      </button>
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
</div>

<script>
  // ---- Fill these in from your Supabase project (Settings > API) ----
  const SUPABASE_URL = "https://peqzoyzxdrsjovpmuirm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ePzp2ldvvl1eh5EGlPdCzg__gnBEnwV";
  // ---------------------------------------------------------------

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const STAFF_EMAIL_DOMAIN = "ascend-fintrack.local"; // internal only, never actually emailed

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  const eyeToggle = document.getElementById('eyeToggle');
  const passwordInput = document.getElementById('password');
  eyeToggle.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    eyeToggle.querySelector('.eye-on').style.display = showing ? '' : 'none';
    eyeToggle.querySelector('.eye-off').style.display = showing ? 'none' : '';
    eyeToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  // If already logged in and authorized, skip straight to dashboard
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'dashboard.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const staffId = document.getElementById('staffId').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const email = `${staffId}@${STAFF_EMAIL_DOMAIN}`;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Incorrect Staff ID or password.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    // Confirm this account belongs to staff or the head of department
    const { data: profile, error: profileError } = await sb
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (profileError || !profile || !['staff', 'head'].includes(profile.role)) {
      await sb.auth.signOut();
      showError('This account is not authorized to access the finance client tracker.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    window.location.href = 'dashboard.html';
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
