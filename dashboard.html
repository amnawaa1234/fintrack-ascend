<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaxBase — Ascend Advisory Group</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4C7E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1C1E26; --muted:#6B7180; --line:#E2E4E9; --bg:#F7F7F5;
    --navy:#2B4C7E; --navy-dark:#1F3A61;
    --green:#2F9E44; --green-bg:#EBFBEE;
    --blue:#2F6FED; --blue-bg:#EDF3FF;
    --red:#E03131; --red-bg:#FFF0F0;
    --grey-bg:#EDEFF3;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; min-height:100vh;}
  header{
    background:var(--navy); color:#fff; padding:16px 28px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:16px; font-weight:600; margin:0;}
  .who{display:flex; align-items:center; gap:14px; font-size:13px;}
  .who .role{opacity:.75;}
  .logout{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .logout:hover{background:rgba(255,255,255,.2);}

  .app-body{flex:1; display:flex; align-items:stretch; min-height:0;}
  main{flex:1; min-width:0; padding:28px;}

  /* ---- Nav sidebar ---- */
  .nav-sidebar{
    width:190px; flex-shrink:0; background:var(--navy-dark); padding:18px 10px;
    display:flex; flex-direction:column; position:sticky; top:0; align-self:flex-start;
    height:100vh; transition:width .15s ease;
  }
  .nav-sidebar.collapsed{width:60px; padding:18px 8px;}
  .nav-toggle{
    align-self:flex-end; background:none; border:none; color:rgba(255,255,255,.55);
    cursor:pointer; font-size:14px; padding:4px; margin-bottom:16px; font-family:inherit;
  }
  .nav-toggle:hover{color:#fff;}
  .nav-sidebar.collapsed .nav-toggle{align-self:center;}
  .nav-item{
    width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border:none; background:none;
    border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500;
    color:rgba(255,255,255,.6); text-align:left; margin-bottom:2px; white-space:nowrap; overflow:hidden;
  }
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:var(--navy); color:#fff;}
  .nav-sidebar.collapsed .nav-item{justify-content:center; padding:9px 0;}
  .nav-sidebar.collapsed .nav-label{display:none;}
  .nav-item .nav-icon{font-size:15px; flex-shrink:0;}

  @media (max-width: 860px){
    .app-body{flex-direction:column;}
    .nav-sidebar{
      width:100%; height:auto; position:static; flex-direction:row; align-items:center;
      overflow-x:auto; padding:10px 14px; order:1;
    }
    .nav-sidebar.collapsed{width:100%;}
    .nav-toggle{display:none;}
    .nav-item{width:auto; margin-bottom:0; margin-right:4px;}
    main{order:2; width:100%; padding:18px;}
  }

  /* ---- Dashboard search bar ---- */
  .dash-search-wrap{position:relative; max-width:420px; margin-bottom:22px;}
  .dash-search-wrap input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  .dash-search-wrap input:focus{outline:none; border-color:var(--navy);}
  .dash-search-results{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14);
    z-index:25; max-height:320px; overflow-y:auto;
  }
  .dash-search-results.open{display:block;}
  .dash-search-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px;
    cursor:pointer; border-bottom:1px solid #F0F0EE; font-size:13px;
  }
  .dash-search-item:last-child{border-bottom:none;}
  .dash-search-item:hover{background:#FAFAF8;}
  .dash-search-item .sname{font-weight:600;}
  .dash-search-item .sform{
    font-size:11px; font-weight:700; color:var(--navy); background:var(--blue-bg);
    padding:3px 8px; border-radius:20px; flex-shrink:0;
  }
  .dash-search-item .sdue{color:var(--muted); font-size:12px; flex-shrink:0;}
  .dash-search-empty{padding:14px; font-size:13px; color:var(--muted); text-align:center;}

  /* ---- Widget cards (sortable) ---- */
  .widget-grid{display:flex; gap:14px; flex-wrap:wrap;}
  .widget-card{
    flex:1; min-width:200px; max-width:280px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:18px 20px; cursor:pointer; user-select:none;
    transition:box-shadow .12s, border-color .12s, opacity .12s;
  }
  .widget-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07); border-color:#D3D7DE;}
  .widget-card.dragging{opacity:.4;}
  .widget-card .widget-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.03em;}
  .widget-card .widget-num{font-size:30px; font-weight:700; margin-top:10px; color:var(--ink);}

  /* ---- Modals (shared) ---- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(28,30,38,.4);
    align-items:center; justify-content:center; padding:20px; z-index:40; overflow-y:auto;
  }
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff; border-radius:10px; padding:24px; width:100%; max-width:400px; max-height:88vh; overflow-y:auto;}
  .modal.wide{max-width:420px;}
  .modal.xwide{max-width:780px;}
  .modal h2{font-size:16px; font-weight:600; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center;}
  .modal label{display:block; font-size:13px; font-weight:500; margin-bottom:6px; margin-top:12px;}
  .modal label:first-of-type{margin-top:0;}
  .modal input, .modal select, .modal textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-family:inherit;
  }
  .modal textarea{resize:vertical; min-height:60px; font-family:inherit;}
  .modal input:focus, .modal select:focus, .modal textarea:focus{outline:none; border-color:var(--navy);}
  .modal-error{color:var(--red); font-size:12px; min-height:16px; margin-top:6px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .modal-actions button{padding:9px 16px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font-family:inherit; font-size:13px;}
  .modal-actions button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .modal-actions button.danger{background:var(--red); color:#fff; border-color:var(--red);}
  .close-x{cursor:pointer; color:var(--muted); font-size:18px; line-height:1;}
  .modal-sub{font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 4px;}

  /* ---- Form list modal ---- */
  .list-toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .list-toolbar input[type="text"]{
    flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line);
    border-radius:7px; font-size:13px; font-family:inherit;
  }
  .list-toolbar input:focus{outline:none; border-color:var(--navy);}
  .list-toolbar button{
    padding:9px 13px; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .list-toolbar button:hover{border-color:var(--navy); color:var(--navy);}
  .list-toolbar button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .list-toolbar button.primary:hover{background:var(--navy-dark); color:#fff;}

  .list-table-wrap{border:1px solid var(--line); border-radius:8px; overflow-x:auto;}
  .list-table{width:100%; border-collapse:collapse; font-size:13px;}
  .list-table thead th{
    text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:10px 14px;
    border-bottom:1px solid var(--line); background:#FAFAF8; white-space:nowrap;
  }
  .list-table tbody td{padding:12px 14px; border-bottom:1px solid #F0F0EE; vertical-align:top;}
  .list-table tbody tr:last-child td{border-bottom:none;}
  .company-cell{font-weight:600; white-space:nowrap;}
  .due-cell{color:var(--muted); white-space:nowrap;}
  .remarks-cell{min-width:260px;}
  .empty-state{padding:26px 6px; text-align:center; color:var(--muted); font-size:13px;}

  .remarks-list{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .remark-item{background:var(--grey-bg); border-radius:7px; padding:9px 11px;}
  .remark-text{
    font-style:italic; font-size:13.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap; word-break:break-word;
  }
  .remark-meta{font-style:normal; font-size:11px; color:var(--muted); margin-top:5px;}
  .no-remarks{font-size:12px; color:var(--muted); margin-bottom:8px;}

  .add-remark-btn{
    width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:#fff;
    color:var(--navy); font-size:15px; line-height:1; cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; font-family:inherit; font-weight:700;
  }
  .add-remark-btn:hover{background:var(--navy); color:#fff; border-color:var(--navy);}

  .remark-compose{margin-top:8px; display:none;}
  .remark-compose textarea{width:100%; font-size:13px; font-family:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:50px;}
  .remark-compose textarea:focus{outline:none; border-color:var(--navy);}
  .remark-compose-actions{display:flex; justify-content:flex-end; gap:6px; margin-top:6px;}
  .remark-compose-actions button{padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:12px; cursor:pointer; font-family:inherit;}
  .remark-compose-actions button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}

  .toast-stack{position:fixed; top:16px; right:16px; z-index:50; display:flex; flex-direction:column; gap:8px; max-width:320px;}
  .toast{background:var(--ink); color:#fff; padding:11px 14px; border-radius:7px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.18); animation:slideIn .18s ease-out;}
  @keyframes slideIn{from{transform:translateX(16px); opacity:0;} to{transform:translateX(0); opacity:1;}}
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<header>
  <h1>TaxBase <span style="opacity:.65; font-weight:400;">— Ascend Advisory Group</span></h1>
  <div class="who">
    <span id="userName">—</span>
    <span class="role" id="userRole"></span>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
</header>

<div class="app-body">

  <aside class="nav-sidebar" id="navSidebar">
    <button class="nav-toggle" id="navToggle" title="Collapse sidebar">«</button>
    <button class="nav-item active"><span class="nav-icon">📋</span><span class="nav-label">Dashboard</span></button>
  </aside>

  <main>
    <div class="dash-search-wrap">
      <input type="text" id="dashSearchInput" placeholder="Search company name...">
      <div class="dash-search-results" id="dashSearchResults"></div>
    </div>

    <div class="widget-grid" id="widgetGrid"></div>
  </main>

</div>

<!-- Form list modal: shows entries for whichever widget was clicked -->
<div class="modal-backdrop" id="listModalBackdrop">
  <div class="modal xwide">
    <h2><span id="listModalTitle">Form C</span><span class="close-x" id="closeListModal">&times;</span></h2>

    <div class="list-toolbar">
      <input type="text" id="listSearchInput" placeholder="Search company name...">
      <button id="listExportBtn">⬇ Export Excel</button>
      <button class="primary" id="listAddBtn">+ Add client</button>
    </div>

    <div class="list-table-wrap">
      <table class="list-table">
        <thead>
          <tr>
            <th style="width:22%;">Company Name</th>
            <th style="width:14%;">Due Date</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody id="listTableBody"><tr><td colspan="3" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add client modal -->
<div class="modal-backdrop" id="entryModalBackdrop">
  <div class="modal">
    <h2><span id="entryModalTitle">Add client</span><span class="close-x" id="closeEntryModal">&times;</span></h2>
    <label for="eCompanyName">Company name</label>
    <input type="text" id="eCompanyName" placeholder="e.g. Meridian Holdings Sdn Bhd">
    <label for="eDueDate">Due date</label>
    <input type="date" id="eDueDate">
    <label for="eRemark">Remarks (optional)</label>
    <textarea id="eRemark" rows="3" placeholder="Optional remark..."></textarea>
    <div class="modal-error" id="entryModalError"></div>
    <div class="modal-actions">
      <button id="cancelEntryModal">Cancel</button>
      <button class="primary" id="saveEntryBtn">Save</button>
    </div>
  </div>
</div>

<!-- Remark confirmation modal -->
<div class="modal-backdrop" id="remarkConfirmBackdrop">
  <div class="modal" style="max-width:360px;">
    <h2>Add this remark?</h2>
    <p class="modal-sub">Are you sure you want to add this remark? Remarks cannot be edited once added.</p>
    <div class="modal-actions">
      <button id="remarkCancelBtn">Cancel</button>
      <button class="primary" id="remarkConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://peqzoyzxdrsjovpmuirm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ePzp2ldvvl1eh5EGlPdCzg__gnBEnwV";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentProfile = null;
  let profilesMap = {};

  const FORMS = [
    { key: 'form_c',  label: 'Form C' },
    { key: 'form_be', label: 'Form BE' }
  ];
  let formData = { form_c: [], form_be: [] };
  let currentListFormType = null;
  let pendingRemark = null; // { entryId, body }

  const isAdmin = () => currentProfile && currentProfile.role === 'head';

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }
  function formatDateDMY(isoDate){
    if (!isoDate) return '—';
    const [y, m, d] = isoDate.split('-');
    if (!y || !m || !d) return isoDate;
    return `${d}-${m}-${y}`;
  }
  function formatTimeMeta(iso){
    const dt = new Date(iso);
    let h = dt.getHours();
    const min = String(dt.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    const dd = String(dt.getDate()).padStart(2, '0');
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const yyyy = dt.getFullYear();
    return `${h}:${min} ${ampm} on ${dd}-${mm}-${yyyy}`;
  }
  function showToast(message){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }

  /* ---------------- Sidebar collapse ---------------- */
  document.getElementById('navToggle').addEventListener('click', () => {
    const sidebar = document.getElementById('navSidebar');
    sidebar.classList.toggle('collapsed');
    document.getElementById('navToggle').textContent = sidebar.classList.contains('collapsed') ? '»' : '«';
  });

  /* ---------------- Profiles (for remark author names) ---------------- */
  async function loadProfiles(){
    const { data, error } = await sb.from('profiles').select('id, full_name, role');
    if (error) return;
    profilesMap = Object.fromEntries(data.map(p => [p.id, p.full_name]));
  }

  /* ---------------- Load form entries + remarks ---------------- */
  async function loadFormEntries(){
    for (const f of FORMS) {
      const { data, error } = await sb.from('form_entries')
        .select('*, form_remarks(id, body, author_id, created_at)')
        .eq('form_type', f.key)
        .order('due_date', { ascending: true, nullsFirst: false });
      if (error) {
        console.warn('Could not load', f.key, error.message);
        formData[f.key] = [];
        continue;
      }
      (data || []).forEach(entry => {
        entry.form_remarks = (entry.form_remarks || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      });
      formData[f.key] = data || [];
    }
    renderWidgets();
    if (currentListFormType) renderListTable();
  }

  /* ---------------- Widget cards (sortable drag & drop) ---------------- */
  let widgetOrder = JSON.parse(localStorage.getItem('taxbase_widget_order') || 'null') || FORMS.map(f => f.key);
  FORMS.forEach(f => { if (!widgetOrder.includes(f.key)) widgetOrder.push(f.key); });
  widgetOrder = widgetOrder.filter(k => FORMS.some(f => f.key === k));
  let draggedKey = null;

  function renderWidgets(){
    const grid = document.getElementById('widgetGrid');
    grid.innerHTML = widgetOrder.map(key => {
      const f = FORMS.find(x => x.key === key);
      const count = (formData[key] || []).length;
      return `
        <div class="widget-card" draggable="true" data-form="${key}">
          <div class="widget-label">${escapeHtml(f.label.toUpperCase())}</div>
          <div class="widget-num">${count}</div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.widget-card').forEach(card => {
      card.addEventListener('click', () => openFormList(card.dataset.form));
      card.addEventListener('dragstart', (e) => {
        draggedKey = card.dataset.form;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        localStorage.setItem('taxbase_widget_order', JSON.stringify(widgetOrder));
        draggedKey = null;
        renderWidgets();
      });
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!draggedKey || draggedKey === card.dataset.form) return;
        const fromIdx = widgetOrder.indexOf(draggedKey);
        const toIdx = widgetOrder.indexOf(card.dataset.form);
        if (fromIdx === -1 || toIdx === -1) return;
        widgetOrder.splice(fromIdx, 1);
        widgetOrder.splice(toIdx, 0, draggedKey);
        renderWidgets();
        const stillDragging = grid.querySelector(`[data-form="${draggedKey}"]`);
        if (stillDragging) stillDragging.classList.add('dragging');
      });
    });
  }

  /* ---------------- Form list modal ---------------- */
  const listModalBackdrop = document.getElementById('listModalBackdrop');
  let listSearchTerm = '';

  function getFilteredEntries(formType){
    const rows = formData[formType] || [];
    if (!listSearchTerm) return rows;
    return rows.filter(e => e.company_name.toLowerCase().includes(listSearchTerm.toLowerCase()));
  }

  function openFormList(formType){
    currentListFormType = formType;
    listSearchTerm = '';
    document.getElementById('listSearchInput').value = '';
    const f = FORMS.find(x => x.key === formType);
    document.getElementById('listModalTitle').textContent = f.label;
    renderListTable();
    listModalBackdrop.classList.add('open');
  }
  function closeListModal(){
    listModalBackdrop.classList.remove('open');
    currentListFormType = null;
  }
  document.getElementById('closeListModal').addEventListener('click', closeListModal);
  listModalBackdrop.addEventListener('click', (e) => { if (e.target === listModalBackdrop) closeListModal(); });

  function renderListTable(){
    const body = document.getElementById('listTableBody');
    const rows = getFilteredEntries(currentListFormType);
    body.innerHTML = rows.length
      ? rows.map(entryRowHtml).join('')
      : `<tr><td colspan="3" class="empty-state">No entries yet. Click "+ Add client" to add one.</td></tr>`;

    body.querySelectorAll('.add-remark-btn').forEach(btn => btn.addEventListener('click', () => toggleCompose(btn.dataset.entry)));
    body.querySelectorAll('.cancel-remark-btn').forEach(btn => btn.addEventListener('click', () => toggleCompose(btn.dataset.entry, true)));
    body.querySelectorAll('.submit-remark-btn').forEach(btn => btn.addEventListener('click', () => onSubmitRemark(btn.dataset.entry)));
  }

  function entryRowHtml(entry){
    const due = formatDateDMY(entry.due_date);
    const remarks = entry.form_remarks || [];
    const remarksHtml = remarks.length
      ? remarks.map(remarkItemHtml).join('')
      : `<div class="no-remarks">No remarks yet.</div>`;
    return `
      <tr>
        <td class="company-cell">${escapeHtml(entry.company_name)}</td>
        <td class="due-cell">${due}</td>
        <td class="remarks-cell">
          <div class="remarks-list">${remarksHtml}</div>
          <button type="button" class="add-remark-btn" data-entry="${entry.id}" title="Add remark">+</button>
          <div class="remark-compose" id="compose-${entry.id}">
            <textarea id="composeText-${entry.id}" rows="2" placeholder="Type a remark..."></textarea>
            <div class="remark-compose-actions">
              <button type="button" class="cancel-remark-btn" data-entry="${entry.id}">Cancel</button>
              <button type="button" class="submit-remark-btn primary" data-entry="${entry.id}">Add</button>
            </div>
          </div>
        </td>
      </tr>`;
  }

  function remarkItemHtml(r){
    const name = escapeHtml(profilesMap[r.author_id] || 'Unknown');
    return `
      <div class="remark-item">
        <div class="remark-text">${escapeHtml(r.body)}</div>
        <div class="remark-meta">Updated by: ${name} at ${formatTimeMeta(r.created_at)}</div>
      </div>`;
  }

  function toggleCompose(entryId, forceClose){
    const el = document.getElementById(`compose-${entryId}`);
    if (!el) return;
    const isOpen = el.style.display === 'block';
    el.style.display = (forceClose || isOpen) ? 'none' : 'block';
    if (!forceClose && !isOpen) document.getElementById(`composeText-${entryId}`).focus();
    if (forceClose) document.getElementById(`composeText-${entryId}`).value = '';
  }

  function onSubmitRemark(entryId){
    const textEl = document.getElementById(`composeText-${entryId}`);
    const body = textEl.value.trim();
    if (!body) { textEl.focus(); return; }
    pendingRemark = { entryId, body };
    document.getElementById('remarkConfirmBackdrop').classList.add('open');
  }

  document.getElementById('remarkCancelBtn').addEventListener('click', () => {
    pendingRemark = null;
    document.getElementById('remarkConfirmBackdrop').classList.remove('open');
  });
  document.getElementById('remarkConfirmBtn').addEventListener('click', async () => {
    if (!pendingRemark) return;
    const btn = document.getElementById('remarkConfirmBtn');
    btn.disabled = true; btn.textContent = 'Adding...';
    const { error } = await sb.from('form_remarks').insert({
      entry_id: pendingRemark.entryId, body: pendingRemark.body, author_id: currentUser.id
    });
    btn.disabled = false; btn.textContent = 'Confirm';
    document.getElementById('remarkConfirmBackdrop').classList.remove('open');
    if (error) { showToast('Could not add remark: ' + error.message); pendingRemark = null; return; }
    pendingRemark = null;
    await loadFormEntries();
  });

  /* ---------------- Add client modal ---------------- */
  const entryModalBackdrop = document.getElementById('entryModalBackdrop');
  document.getElementById('listAddBtn').addEventListener('click', () => {
    const f = FORMS.find(x => x.key === currentListFormType);
    document.getElementById('entryModalTitle').textContent = `Add client — ${f.label}`;
    document.getElementById('eCompanyName').value = '';
    document.getElementById('eDueDate').value = '';
    document.getElementById('eRemark').value = '';
    document.getElementById('entryModalError').textContent = '';
    entryModalBackdrop.classList.add('open');
    document.getElementById('eCompanyName').focus();
  });
  function closeEntryModal(){ entryModalBackdrop.classList.remove('open'); }
  document.getElementById('closeEntryModal').addEventListener('click', closeEntryModal);
  document.getElementById('cancelEntryModal').addEventListener('click', closeEntryModal);
  entryModalBackdrop.addEventListener('click', (e) => { if (e.target === entryModalBackdrop) closeEntryModal(); });

  document.getElementById('saveEntryBtn').addEventListener('click', async () => {
    const company_name = document.getElementById('eCompanyName').value.trim();
    const due_date = document.getElementById('eDueDate').value || null;
    const remark = document.getElementById('eRemark').value.trim();
    const errEl = document.getElementById('entryModalError');
    if (!company_name) { errEl.textContent = 'Enter a company name.'; return; }
    if (!due_date) { errEl.textContent = 'Choose a due date.'; return; }

    const btn = document.getElementById('saveEntryBtn');
    btn.disabled = true; btn.textContent = 'Saving...';

    const { data: newEntry, error } = await sb.from('form_entries')
      .insert({ form_type: currentListFormType, company_name, due_date, created_by: currentUser.id })
      .select().single();

    if (error) {
      btn.disabled = false; btn.textContent = 'Save';
      errEl.textContent = 'Could not save: ' + error.message;
      return;
    }

    if (remark && newEntry) {
      const { error: remarkError } = await sb.from('form_remarks')
        .insert({ entry_id: newEntry.id, body: remark, author_id: currentUser.id });
      if (remarkError) showToast('Client saved, but the remark could not be added: ' + remarkError.message);
    }

    btn.disabled = false; btn.textContent = 'Save';
    closeEntryModal();
    showToast(`${company_name} added.`);
    await loadFormEntries();
  });

  /* ---------------- List search (inside a form's modal) ---------------- */
  document.getElementById('listSearchInput').addEventListener('input', (e) => {
    listSearchTerm = e.target.value;
    renderListTable();
  });

  /* ---------------- Export Excel (per form, respects current filter) ---------------- */
  document.getElementById('listExportBtn').addEventListener('click', () => {
    const f = FORMS.find(x => x.key === currentListFormType);
    const rows = getFilteredEntries(currentListFormType);
    const data = rows.map(e => ({
      'Company Name': e.company_name,
      'Due Date': formatDateDMY(e.due_date),
      'Remarks': (e.form_remarks || []).map(r =>
        `${r.body} — ${profilesMap[r.author_id] || 'Unknown'} (${formatTimeMeta(r.created_at)})`
      ).join(' | ')
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, f.label);
    XLSX.writeFile(wb, `${f.label.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0, 10)}.xlsx`);
  });

  /* ---------------- Dashboard search (quick finder across both forms) ---------------- */
  const dashSearchInput = document.getElementById('dashSearchInput');
  const dashSearchResults = document.getElementById('dashSearchResults');
  dashSearchInput.addEventListener('input', () => {
    const term = dashSearchInput.value.trim().toLowerCase();
    if (!term) { dashSearchResults.classList.remove('open'); dashSearchResults.innerHTML = ''; return; }
    const matches = [];
    FORMS.forEach(f => {
      (formData[f.key] || []).forEach(entry => {
        if (entry.company_name.toLowerCase().includes(term)) matches.push({ entry, form: f });
      });
    });
    if (!matches.length) {
      dashSearchResults.innerHTML = `<div class="dash-search-empty">No companies match "${escapeHtml(dashSearchInput.value.trim())}".</div>`;
    } else {
      dashSearchResults.innerHTML = matches.slice(0, 8).map(({ entry, form }) => `
        <div class="dash-search-item" data-form="${form.key}">
          <span class="sname">${escapeHtml(entry.company_name)}</span>
          <span class="sform">${escapeHtml(form.label)}</span>
          <span class="sdue">${formatDateDMY(entry.due_date)}</span>
        </div>`).join('');
      dashSearchResults.querySelectorAll('.dash-search-item').forEach(el => {
        el.addEventListener('click', () => {
          openFormList(el.dataset.form);
          dashSearchResults.classList.remove('open');
          dashSearchInput.value = '';
        });
      });
    }
    dashSearchResults.classList.add('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.dash-search-wrap')) dashSearchResults.classList.remove('open');
  });

  /* ---------------- Realtime ---------------- */
  function setupRealtime(){
    sb.channel('forms-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'form_entries' }, () => loadFormEntries())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'form_remarks' }, () => loadFormEntries())
      .subscribe();
  }

  /* ---------------- Auth / init ---------------- */
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;

    const { data: profile } = await sb.from('profiles').select('full_name, role').eq('id', currentUser.id).single();
    if (!profile || !['staff', 'head'].includes(profile.role)) {
      await sb.auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    currentProfile = profile;
    document.getElementById('userName').textContent = profile.full_name;
    document.getElementById('userRole').textContent = profile.role === 'head' ? 'Admin' : 'Staff';
    document.body.classList.add(profile.role === 'head' ? 'admin-view' : 'staff-view');

    showToast(`Welcome, ${profile.full_name}! 👋`);
    setupRealtime();

    await loadProfiles();
    await loadFormEntries();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
</script>
</body>
</html>
