<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinTrack — Ascend Advisory Group</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4C7E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1C1E26; --muted:#6B7180; --line:#E2E4E9; --bg:#F7F7F5;
    --navy:#2B4C7E; --navy-dark:#1F3A61;
    --green:#2F9E44; --green-bg:#EBFBEE;
    --blue:#2F6FED; --blue-bg:#EDF3FF;
    --red:#E03131; --red-bg:#FFF0F0;
    --grey-bg:#EDEFF3;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; min-height:100vh;}
  header{
    background:var(--navy); color:#fff; padding:16px 28px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:16px; font-weight:600; margin:0;}
  .who{display:flex; align-items:center; gap:14px; font-size:13px;}
  .who .role{opacity:.75;}
  .logout{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .logout:hover{background:rgba(255,255,255,.2);}

  .app-body{flex:1; display:flex; align-items:stretch; min-height:0;}
  main{flex:1; min-width:0; padding:28px;}

  /* ---- Nav sidebar: Board / Overview, full-height dark rail, collapsible ---- */
  .nav-sidebar{
    width:190px; flex-shrink:0; background:var(--navy-dark); padding:18px 10px;
    display:flex; flex-direction:column; position:sticky; top:0; align-self:flex-start;
    height:100vh; transition:width .15s ease;
  }
  .nav-sidebar.collapsed{width:60px; padding:18px 8px;}
  .nav-toggle{
    align-self:flex-end; background:none; border:none; color:rgba(255,255,255,.55);
    cursor:pointer; font-size:14px; padding:4px; margin-bottom:16px; font-family:inherit;
  }
  .nav-toggle:hover{color:#fff;}
  .nav-sidebar.collapsed .nav-toggle{align-self:center;}
  .nav-item{
    width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border:none; background:none;
    border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:500;
    color:rgba(255,255,255,.6); text-align:left; margin-bottom:2px; white-space:nowrap; overflow:hidden;
  }
  .nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
  .nav-item.active{background:var(--navy); color:#fff;}
  .nav-sidebar.collapsed .nav-item{justify-content:center; padding:9px 0;}
  .nav-sidebar.collapsed .nav-label{display:none;}
  .nav-item .nav-icon{font-size:15px; flex-shrink:0;}

  /* ---- Folder-style status tabs (All / In Progress / Delayed / Completed / Bin) ---- */
  .folder-tabs{display:flex; gap:4px; align-items:flex-end; flex-wrap:wrap;}
  .folder-tab{
    padding:9px 16px 8px; border:1px solid var(--line); border-bottom:none;
    border-radius:10px 10px 0 0; background:#EEF0F3; color:var(--muted);
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
    position:relative; top:1px; transition:background .12s, color .12s;
  }
  .folder-tab:hover{background:#E4E7EC;}
  .folder-tab .count{font-weight:700; margin-left:5px; opacity:.7;}
  .folder-tab.active{background:#fff; top:0; z-index:2; color:var(--ink);}
  .folder-tab.active.blue{color:var(--blue);}
  .folder-tab.active.red{color:var(--red);}
  .folder-tab.active.green{color:var(--green);}
  .folder-tab.active.bin{color:var(--ink);}

  .tabs{display:flex; gap:6px; margin-bottom:18px;}
  .tabs button{
    padding:8px 14px; border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;
  }
  .tabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* Admin doesn't get "My clients only" — that's a staff-only filter */
  body.admin-view #myClientsLabel{display:none;}

  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type="text"]{
    flex:1; min-width:180px; padding:10px 14px; border:1px solid var(--line);
    border-radius:7px; font-size:14px; font-family:inherit; background:#fff;
  }
  .toolbar input:focus{outline:none; border-color:var(--navy);}
  .toolbar button, .toolbar label.filebtn{
    padding:10px 14px; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .toolbar button:hover, .toolbar label.filebtn:hover{border-color:var(--navy); color:var(--navy);}
  .toolbar button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .toolbar button.primary:hover{background:var(--navy-dark); color:#fff;}
  .toolbar .check{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink); cursor:pointer;}

  .popover{position:relative; display:inline-block;}
  .popover-menu{
    position:absolute; top:calc(100% + 6px); left:0; background:#fff; border:1px solid var(--line);
    border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); padding:12px; z-index:20; display:none; width:230px;
  }
  .popover-menu.open{display:block;}
  .popover-menu .section-label{font-size:11px; color:var(--muted); font-weight:600; margin:0 0 6px; text-transform:uppercase; letter-spacing:.02em;}
  .popover-menu .order-row{display:flex; gap:6px; margin-bottom:12px;}
  .popover-menu button{
    padding:6px 0; border:1px solid var(--line); background:#fff; border-radius:5px;
    font-size:12px; cursor:pointer; font-family:inherit;
  }
  .popover-menu button:hover{border-color:var(--navy); color:var(--navy);}
  .popover-menu button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .popover-menu .order-row button{flex:1;}
  .letter-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px;}
  .letter-grid button.all-letters{grid-column:1/-1; margin-bottom:4px;}

  .table-wrap{background:#fff; border:1px solid var(--line); border-radius:8px; overflow-x:auto;}
  .client-table{width:100%; border-collapse:collapse; font-size:13px;}
  .client-table thead th{
    text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:11px 14px;
    border-bottom:1px solid var(--line); background:#FAFAF8; white-space:nowrap;
  }
  .client-table tbody td{padding:11px 14px; border-bottom:1px solid #F0F0EE; vertical-align:middle; white-space:nowrap;}
  .client-table tbody tr:last-child td{border-bottom:none;}
  .client-table tbody tr:hover{background:#FAFAF8;}
  .client-name-link{font-weight:600; cursor:pointer;}
  .client-name-link:hover{color:var(--navy); text-decoration:underline;}
  .muted-cell{color:var(--muted);}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{
    border:1px solid var(--line); background:#fff; border-radius:6px; width:28px; height:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--navy);}
  .status-pill{
    font-family:inherit; font-size:12px; font-weight:700; border-radius:20px; padding:7px 14px;
    border:2px solid transparent; cursor:pointer; appearance:none; -webkit-appearance:none;
  }
  .status-pill.blue{background:var(--blue-bg); color:var(--blue);}
  .status-pill.red{background:var(--red-bg); color:var(--red);}
  .status-pill.green{background:var(--green-bg); color:var(--green);}
  .column-empty{padding:22px 6px; text-align:center; color:var(--muted); font-size:13px; white-space:normal;}

  body.staff-view .actions-col,
  body.staff-view #modeExcelBtn{ display:none !important; }

  @media (max-width: 860px){
    .app-body{flex-direction:column;}
    .nav-sidebar{
      width:100%; height:auto; position:static; flex-direction:row; align-items:center;
      overflow-x:auto; padding:10px 14px; order:1;
    }
    .nav-sidebar.collapsed{width:100%;}
    .nav-toggle{display:none;}
    .nav-item{width:auto; margin-bottom:0; margin-right:4px;}
    main{order:2; width:100%; padding:18px;}
  }

  .stat-row{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .stat-card{flex:1; min-width:140px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px;}
  .stat-card .num{font-size:26px; font-weight:700;}
  .stat-card .label{font-size:12px; color:var(--muted); margin-top:2px;}
  .panel{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:18px;}
  .panel h3{font-size:14px; font-weight:600; margin:0 0 12px;}
  .panel table{width:100%; border-collapse:collapse; font-size:13px;}
  .panel th{text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line);}
  .panel td{padding:7px 8px; border-bottom:1px solid #F0F0EE;}

  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(28,30,38,.4);
    align-items:center; justify-content:center; padding:20px; z-index:40; overflow-y:auto;
  }
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff; border-radius:10px; padding:24px; width:100%; max-width:400px; max-height:88vh; overflow-y:auto;}
  .modal.wide{max-width:520px;}
  .modal h2{font-size:16px; font-weight:600; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center;}
  .modal label{display:block; font-size:13px; font-weight:500; margin-bottom:6px; margin-top:12px;}
  .modal label:first-of-type{margin-top:0;}
  .modal input, .modal select, .modal textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-family:inherit;
  }
  .modal textarea{resize:vertical; min-height:60px;}
  .modal input:focus, .modal select:focus, .modal textarea:focus{outline:none; border-color:var(--navy);}
  .modal-error{color:var(--red); font-size:12px; min-height:16px; margin-top:6px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .modal-actions button{padding:9px 16px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; font-family:inherit; font-size:13px;}
  .modal-actions button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .modal-actions button.danger{background:var(--red); color:#fff; border-color:var(--red);}
  .close-x{cursor:pointer; color:var(--muted); font-size:18px; line-height:1;}

  .detail-meta{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:16px;}
  .detail-section{margin-top:18px;}
  .detail-section h4{font-size:12px; text-transform:none; color:var(--muted); font-weight:600; margin:0 0 10px;}
  .note-item{border-bottom:1px solid #F0F0EE; padding:8px 0; font-size:13px;}
  .note-item .meta{font-size:11px; color:var(--muted); margin-bottom:3px;}
  .history-item{font-size:12px; color:var(--muted); padding:5px 0; display:flex; gap:6px; align-items:center;}
  .add-note-row{display:flex; gap:8px; margin-top:10px;}
  .add-note-row textarea{flex:1;}
  .add-note-row button{padding:0 14px; background:var(--navy); color:#fff; border:none; border-radius:7px; cursor:pointer; font-family:inherit; font-size:13px;}

  .toast-stack{position:fixed; top:16px; right:16px; z-index:50; display:flex; flex-direction:column; gap:8px; max-width:320px;}
  .toast{background:var(--ink); color:#fff; padding:11px 14px; border-radius:7px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.18); animation:slideIn .18s ease-out;}
  @keyframes slideIn{from{transform:translateX(16px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .alert-stack{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; width:100%; max-width:440px; padding:0 16px;}
  .alert{background:var(--red-bg); border:1px solid #FFC9C9; color:var(--ink); padding:12px 14px; border-radius:8px; display:flex; align-items:center; gap:12px; box-shadow:0 4px 14px rgba(0,0,0,.1); animation:slideIn .18s ease-out;}
  .alert .dot{width:8px;height:8px;border-radius:50%;background:var(--red); flex-shrink:0;}
  .alert-text{flex:1; font-size:13px; line-height:1.4;}
  .alert-text b{font-weight:600;}
  .alert button{flex-shrink:0; padding:7px 12px; background:var(--red); color:#fff; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>
<div class="alert-stack" id="alertStack"></div>

<header>
  <h1>FinTrack <span style="opacity:.65; font-weight:400;">— Ascend Advisory Group</span></h1>
  <div class="who">
    <span id="userName">—</span>
    <span class="role" id="userRole"></span>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
</header>

<div class="app-body">

  <aside class="nav-sidebar" id="navSidebar">
    <button class="nav-toggle" id="navToggle" title="Collapse sidebar">«</button>
    <button class="nav-item active" id="tabBoard"><span class="nav-icon">📋</span><span class="nav-label">Board</span></button>
    <button class="nav-item" id="tabOverview" style="display:none;"><span class="nav-icon">📊</span><span class="nav-label">Overview</span></button>
  </aside>

  <main>
    <div id="boardView">
      <div class="folder-tabs" id="filterTabs"></div>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search client name...">
        <label class="check" id="myClientsLabel"><input type="checkbox" id="myClientsToggle"> My clients only</label>
        <div class="popover">
          <button id="sortBtn" type="button">Sort A–Z ↕</button>
          <div class="popover-menu" id="sortMenu">
            <div class="section-label">Order</div>
            <div class="order-row">
              <button id="ascBtn" type="button">A → Z</button>
              <button id="descBtn" type="button">Z → A</button>
            </div>
            <div class="section-label">Jump to letter</div>
            <div class="letter-grid" id="letterGrid"></div>
          </div>
        </div>
        <button id="exportBtn">⬇ Export Excel</button>
        <button class="primary" id="addBtn">+ Add client</button>
      </div>

      <div class="table-wrap">
        <table class="client-table">
          <thead>
            <tr>
              <th>Client</th>
              <th>Assigned to</th>
              <th>Due date</th>
              <th>Status</th>
              <th>Last updated</th>
              <th>Notes</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="clientsBody"><tr><td colspan="7" class="column-empty">Loading clients...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="overviewView" style="display:none;"></div>
  </main>

</div>

<div class="modal-backdrop" id="clientModalBackdrop">
  <div class="modal">
    <h2><span id="clientModalTitle">Add client</span><span class="close-x" id="closeClientModal">&times;</span></h2>

    <div class="tabs" id="addModeTabs" style="margin-bottom:16px;">
      <button class="active" id="modeSingle" type="button">Single client</button>
      <button id="modeExcelBtn" type="button">Import Excel</button>
    </div>

    <div id="singlePanel">
      <label for="cName">Client name</label>
      <input type="text" id="cName" placeholder="e.g. Meridian Holdings Pte Ltd">
      <label for="cDueDate">Due date (optional)</label>
      <input type="date" id="cDueDate">
      <label for="cAssigned">Assigned to</label>
      <select id="cAssigned"><option value="">Unassigned</option></select>
      <div class="modal-error" id="clientModalError"></div>
      <div class="modal-actions">
        <button id="cancelClientModal">Cancel</button>
        <button class="primary" id="saveClientBtn">Save</button>
      </div>
    </div>

    <div id="excelPanel" style="display:none;">
      <label for="excelFile">Excel file (.xlsx)</label>
      <input type="file" id="excelFile" accept=".xlsx,.xls">
      <label for="excelAssigned">Assign all clients in this file to</label>
      <select id="excelAssigned"><option value="">Unassigned</option></select>
      <p style="font-size:12px; color:var(--muted); margin:10px 0 0;">
        First row should be a header with columns <code>name</code> and <code>due_date</code> — due_date is optional (format YYYY-MM-DD).
      </p>
      <div class="modal-error" id="excelError"></div>
      <div class="modal-actions">
        <button id="cancelExcelModal">Cancel</button>
        <button class="primary" id="importExcelBtn">Import</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="detailBackdrop">
  <div class="modal wide">
    <h2><span id="detailName">Client</span><span class="close-x" id="closeDetail">&times;</span></h2>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="modal-actions" style="margin-top:0; justify-content:flex-start;">
      <button id="detailEditBtn">Edit details</button>
      <button class="danger" id="detailDeleteBtn">Delete client</button>
    </div>

    <div class="detail-section">
      <h4>Notes</h4>
      <div id="notesList"></div>
      <div class="add-note-row">
        <textarea id="newNoteText" placeholder="Add a note..." rows="2"></textarea>
        <button id="addNoteBtn">Add</button>
      </div>
    </div>

    <div class="detail-section">
      <h4>History</h4>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://peqzoyzxdrsjovpmuirm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ePzp2ldvvl1eh5EGlPdCzg__gnBEnwV";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentProfile = null;
  let clients = [];
  let deletedClients = [];
  let profilesMap = {};
  let staffList = [];
  let sortAsc = true;
  let searchTerm = '';
  let myClientsOnly = false;
  let statusFilter = 'all';
  let letterFilter = null;
  let editingClientId = null;
  let openDetailId = null;

  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const isAdmin = () => currentProfile && currentProfile.role === 'head';

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }
  function timeAgo(iso){
    if (!iso) return '—';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }
  function statusLabel(s){ return { green: 'Completed', blue: 'In Progress', red: 'Delayed 1 month' }[s] || s; }

  function baseFiltered(){
    let rows = clients.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()));
    if (myClientsOnly) rows = rows.filter(c => c.assigned_to === currentUser.id);
    if (letterFilter) rows = rows.filter(c => c.name.toUpperCase().startsWith(letterFilter));
    return rows;
  }
  function visibleClients(){
    let rows = baseFiltered();
    if (statusFilter !== 'all') rows = rows.filter(c => c.status === statusFilter);
    rows.sort((a, b) => sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
    return rows;
  }

  function renderFilterTabs(){
    const rows = baseFiltered();
    const counts = { all: rows.length, blue: 0, red: 0, green: 0, bin: deletedClients.length };
    rows.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });
    const tabs = [
      { key: 'all',   label: 'All',               cls: 'all'   },
      { key: 'blue',  label: 'In Progress',        cls: 'blue'  },
      { key: 'red',   label: 'Delayed 1 month',    cls: 'red'   },
      { key: 'green', label: 'Completed',          cls: 'green' },
      { key: 'bin',   label: '🗑 Bin',             cls: 'bin'   }
    ];
    document.getElementById('filterTabs').innerHTML = tabs.map(t => `
      <button type="button" class="folder-tab ${t.cls} ${statusFilter === t.key ? 'active' : ''}" data-key="${t.key}">
        ${t.label}<span class="count">${counts[t.key] || 0}</span>
      </button>`).join('');
    document.querySelectorAll('.folder-tab').forEach(btn => btn.addEventListener('click', () => {
      statusFilter = btn.dataset.key;
      render();
    }));
  }

  function binRows(){
    let rows = deletedClients.filter(d => d.name.toLowerCase().includes(searchTerm.toLowerCase()));
    if (letterFilter) rows = rows.filter(d => d.name.toUpperCase().startsWith(letterFilter));
    rows.sort((a, b) => sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
    return rows;
  }

  function binRowHtml(d){
    const due = d.due_date ? d.due_date : '—';
    const who = d.assigned_to ? escapeHtml(profilesMap[d.assigned_to] || '—') : 'Unassigned';
    return `
      <tr style="opacity:.65;">
        <td>${escapeHtml(d.name)}</td>
        <td class="muted-cell">${who}</td>
        <td class="muted-cell">${due}</td>
        <td><span class="status-pill" style="background:var(--grey-bg); color:var(--muted); cursor:default;">Deleted</span></td>
        <td class="muted-cell">${timeAgo(d.deleted_at)} by ${escapeHtml(profilesMap[d.deleted_by] || 'Unknown')}</td>
        <td></td>
        <td class="actions-col"></td>
      </tr>`;
  }

  function render(){
    renderFilterTabs();
    const body = document.getElementById('clientsBody');

    if (statusFilter === 'bin') {
      const rows = binRows();
      body.innerHTML = rows.length
        ? rows.map(binRowHtml).join('')
        : `<tr><td colspan="7" class="column-empty">Bin is empty.</td></tr>`;
      return;
    }

    const rows = visibleClients();
    body.innerHTML = rows.length
      ? rows.map(rowHtml).join('')
      : `<tr><td colspan="7" class="column-empty">No clients match.</td></tr>`;

    document.querySelectorAll('.status-pill').forEach(sel => sel.addEventListener('change', onStatusChange));
    document.querySelectorAll('.client-name-link').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
    document.querySelectorAll('.notes-icon').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
    document.querySelectorAll('.edit-icon').forEach(el => el.addEventListener('click', () => openClientModal(el.dataset.id)));
    document.querySelectorAll('.delete-icon').forEach(el => el.addEventListener('click', () => deleteClient(el.dataset.id)));
  }

  function rowHtml(c){
    const due = c.due_date ? c.due_date : '—';
    const who = c.assigned_to ? escapeHtml(profilesMap[c.assigned_to] || '—') : 'Unassigned';
    return `
      <tr>
        <td><span class="client-name-link" data-id="${c.id}">${escapeHtml(c.name)}</span></td>
        <td class="muted-cell">${who}</td>
        <td class="muted-cell">${due}</td>
        <td>
          <select class="status-pill ${c.status}" data-id="${c.id}">
            <option value="blue"  ${c.status==='blue' ?'selected':''}>In Progress</option>
            <option value="red"   ${c.status==='red'  ?'selected':''}>Delayed 1 month</option>
            <option value="green" ${c.status==='green'?'selected':''}>Completed</option>
          </select>
        </td>
        <td class="muted-cell">${timeAgo(c.updated_at)}</td>
        <td>
          <span class="icon-btn notes-icon" data-id="${c.id}" title="Notes">📝</span>
        </td>
        <td class="actions-col">
          <div class="row-actions">
            <span class="icon-btn edit-icon" data-id="${c.id}" title="Edit">✎</span>
            <span class="icon-btn delete-icon" data-id="${c.id}" title="Delete">🗑</span>
          </div>
        </td>
      </tr>`;
  }

  async function onStatusChange(e){
    const id = e.target.dataset.id;
    const newStatus = e.target.value;
    e.target.disabled = true;
    e.target.className = `status-pill ${newStatus}`;
    const { error } = await sb.from('clients')
      .update({ status: newStatus, updated_by: currentUser.id, updated_at: new Date().toISOString() })
      .eq('id', id);
    e.target.disabled = false;
    if (error) { alert('Could not update status: ' + error.message); await loadClients(); return; }
    await loadClients();
  }

  function updateSortLabel(){
    document.getElementById('sortBtn').textContent = letterFilter
      ? `Letter: ${letterFilter} ▾`
      : (sortAsc ? 'Sort A–Z ↕' : 'Sort Z–A ↕');
  }
  function buildSortMenu(){
    document.getElementById('ascBtn').classList.toggle('active', sortAsc);
    document.getElementById('descBtn').classList.toggle('active', !sortAsc);
    const grid = document.getElementById('letterGrid');
    grid.innerHTML = `<button type="button" class="all-letters ${!letterFilter ? 'active' : ''}" data-letter="">All letters</button>` +
      LETTERS.map(l => `<button type="button" class="${letterFilter === l ? 'active' : ''}" data-letter="${l}">${l}</button>`).join('');
    grid.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      letterFilter = btn.dataset.letter || null;
      updateSortLabel();
      document.getElementById('sortMenu').classList.remove('open');
      render();
    }));
  }
  document.getElementById('sortBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    buildSortMenu();
    document.getElementById('sortMenu').classList.toggle('open');
  });
  document.getElementById('ascBtn').addEventListener('click', () => { sortAsc = true; updateSortLabel(); buildSortMenu(); render(); });
  document.getElementById('descBtn').addEventListener('click', () => { sortAsc = false; updateSortLabel(); buildSortMenu(); render(); });
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('sortMenu');
    if (menu.classList.contains('open') && !e.target.closest('.popover')) menu.classList.remove('open');
  });

  async function loadProfiles(){
    const { data, error } = await sb.from('profiles').select('id, full_name, role');
    if (error) return;
    profilesMap = Object.fromEntries(data.map(p => [p.id, p.full_name]));
    staffList = data;
    const opts = '<option value="">Unassigned</option>' + data.map(p => `<option value="${p.id}">${escapeHtml(p.full_name)}</option>`).join('');
    document.getElementById('cAssigned').innerHTML = opts;
    document.getElementById('excelAssigned').innerHTML = opts;
  }

  async function loadClients(){
    const { data, error } = await sb.from('clients').select('*');
    if (error) {
      document.getElementById('clientsBody').innerHTML = `<tr><td colspan="7" class="column-empty">Could not load clients: ${escapeHtml(error.message)}</td></tr>`;
      return;
    }
    clients = data;
    await checkOverdue();
    render();
    if (isAdmin()) renderOverview();
  }

  async function loadDeletedClients(){
    const { data, error } = await sb.from('deleted_clients').select('*').order('deleted_at', { ascending: false }).limit(300);
    if (error) { console.warn('Could not load deleted clients:', error.message); return; }
    deletedClients = data || [];
    if (statusFilter === 'bin') render();
    else renderFilterTabs(); // just refresh the Bin count
  }

  async function checkOverdue(){
    const today = new Date().toISOString().slice(0, 10);
    const overdue = clients.filter(c => c.due_date && c.due_date < today && c.status === 'blue');
    for (const c of overdue) {
      c.status = 'red';
      await sb.from('clients')
        .update({ status: 'red', updated_by: currentUser.id, updated_at: new Date().toISOString() })
        .eq('id', c.id);
    }
  }

  const clientModalBackdrop = document.getElementById('clientModalBackdrop');
  function setAddMode(mode){
    document.getElementById('modeSingle').classList.toggle('active', mode === 'single');
    document.getElementById('modeExcelBtn').classList.toggle('active', mode === 'excel');
    document.getElementById('singlePanel').style.display = mode === 'single' ? 'block' : 'none';
    document.getElementById('excelPanel').style.display = mode === 'excel' ? 'block' : 'none';
  }
  document.getElementById('modeSingle').addEventListener('click', () => setAddMode('single'));
  document.getElementById('modeExcelBtn').addEventListener('click', () => {
    if (!isAdmin()) { alert('Only Admin can import clients from Excel and assign them to staff.'); return; }
    setAddMode('excel');
  });

  function openClientModal(id){
    if (id && !isAdmin()) { alert('Only Admin can edit client details.'); return; }
    editingClientId = id || null;
    document.getElementById('clientModalTitle').textContent = id ? 'Edit client' : 'Add client';
    document.getElementById('clientModalError').textContent = '';
    document.getElementById('excelError').textContent = '';
    document.getElementById('addModeTabs').style.display = (id || !isAdmin()) ? 'none' : 'flex';
    setAddMode('single');
    if (id) {
      const c = clients.find(x => x.id === id);
      document.getElementById('cName').value = c.name;
      document.getElementById('cDueDate').value = c.due_date || '';
      document.getElementById('cAssigned').value = c.assigned_to || '';
    } else {
      document.getElementById('cName').value = '';
      document.getElementById('cDueDate').value = '';
      document.getElementById('cAssigned').value = '';
      document.getElementById('excelFile').value = '';
      document.getElementById('excelAssigned').value = '';
    }
    clientModalBackdrop.classList.add('open');
    document.getElementById('cName').focus();
  }
  function closeClientModal(){ clientModalBackdrop.classList.remove('open'); }
  document.getElementById('addBtn').addEventListener('click', () => openClientModal(null));
  document.getElementById('cancelClientModal').addEventListener('click', closeClientModal);
  document.getElementById('cancelExcelModal').addEventListener('click', closeClientModal);
  document.getElementById('closeClientModal').addEventListener('click', closeClientModal);
  clientModalBackdrop.addEventListener('click', (e) => { if (e.target === clientModalBackdrop) closeClientModal(); });

  document.getElementById('saveClientBtn').addEventListener('click', async () => {
    const name = document.getElementById('cName').value.trim();
    const due_date = document.getElementById('cDueDate').value || null;
    const assigned_to = document.getElementById('cAssigned').value || null;
    const errEl = document.getElementById('clientModalError');
    if (!name) { errEl.textContent = 'Enter a client name.'; return; }
    if (editingClientId && !isAdmin()) { errEl.textContent = 'Only Admin can edit client details.'; return; }

    const btn = document.getElementById('saveClientBtn');
    btn.disabled = true; btn.textContent = 'Saving...';

    let error;
    if (editingClientId) {
      ({ error } = await sb.from('clients')
        .update({ name, due_date, assigned_to, updated_by: currentUser.id, updated_at: new Date().toISOString() })
        .eq('id', editingClientId));
    } else {
      ({ error } = await sb.from('clients')
        .insert({ name, due_date, assigned_to, status: 'blue', updated_by: currentUser.id, updated_at: new Date().toISOString() }));
    }

    btn.disabled = false; btn.textContent = 'Save';
    if (error) { errEl.textContent = 'Could not save: ' + error.message; return; }
    closeClientModal();
    await loadClients();
  });

  async function deleteClient(id){
    if (!isAdmin()) { alert('Only Admin can delete clients.'); return; }
    const c = clients.find(x => x.id === id);
    if (!c) return;
    if (!confirm(`Delete "${c.name}"? This cannot be undone.`)) return;

    const { error: logError } = await sb.from('deleted_clients').insert({
      name: c.name, due_date: c.due_date, assigned_to: c.assigned_to, deleted_by: currentUser.id
    });
    if (logError) console.warn('Could not log deletion:', logError.message);

    const { error } = await sb.from('clients').delete().eq('id', id);
    if (error) { alert('Could not delete: ' + error.message); return; }
    closeDetailModal();
    await loadClients();
    await loadDeletedClients();
  }

  const detailBackdrop = document.getElementById('detailBackdrop');
  async function openDetail(id){
    openDetailId = id;
    const c = clients.find(x => x.id === id);
    if (!c) return;
    document.getElementById('detailName').textContent = c.name;
    document.getElementById('detailMeta').innerHTML = `
      <span>${statusLabel(c.status)}</span>
      <span>${c.due_date ? 'Due ' + c.due_date : 'No due date'}</span>
      <span>${c.assigned_to ? escapeHtml(profilesMap[c.assigned_to] || '—') : 'Unassigned'}</span>
    `;
    document.getElementById('detailEditBtn').style.display = isAdmin() ? 'inline-flex' : 'none';
    document.getElementById('detailDeleteBtn').style.display = isAdmin() ? 'inline-flex' : 'none';
    document.getElementById('detailEditBtn').onclick = () => { closeDetailModal(); openClientModal(id); };
    document.getElementById('detailDeleteBtn').onclick = () => deleteClient(id);
    detailBackdrop.classList.add('open');
    await loadNotes(id);
    await loadHistory(id);
  }
  function closeDetailModal(){ detailBackdrop.classList.remove('open'); openDetailId = null; }
  document.getElementById('closeDetail').addEventListener('click', closeDetailModal);
  detailBackdrop.addEventListener('click', (e) => { if (e.target === detailBackdrop) closeDetailModal(); });

  async function loadNotes(clientId){
    const { data } = await sb.from('client_notes').select('*').eq('client_id', clientId).order('created_at', { ascending: false });
    const list = document.getElementById('notesList');
    if (!data || data.length === 0) { list.innerHTML = `<div class="column-empty">No notes yet.</div>`; return; }
    list.innerHTML = data.map(n => `
      <div class="note-item">
        <div class="meta">${escapeHtml(profilesMap[n.author_id] || 'Unknown')} · ${timeAgo(n.created_at)}</div>
        ${escapeHtml(n.body)}
      </div>`).join('');
  }

  async function loadHistory(clientId){
    const { data } = await sb.from('status_history').select('*').eq('client_id', clientId).order('changed_at', { ascending: false });
    const list = document.getElementById('historyList');
    if (!data || data.length === 0) { list.innerHTML = `<div class="column-empty">No history yet.</div>`; return; }
    list.innerHTML = data.map(h => `
      <div class="history-item">
        ${h.old_status ? statusLabel(h.old_status) + ' → ' : 'Created as '}${statusLabel(h.new_status)}
        by ${escapeHtml(profilesMap[h.changed_by] || 'Unknown')} · ${timeAgo(h.changed_at)}
      </div>`).join('');
  }

  document.getElementById('addNoteBtn').addEventListener('click', async () => {
    const textEl = document.getElementById('newNoteText');
    const body = textEl.value.trim();
    if (!body || !openDetailId) return;
    const btn = document.getElementById('addNoteBtn');
    btn.disabled = true;
    const { error } = await sb.from('client_notes').insert({ client_id: openDetailId, author_id: currentUser.id, body });
    btn.disabled = false;
    if (error) { alert('Could not add note: ' + error.message); return; }
    textEl.value = '';
    await loadNotes(openDetailId);
  });

  document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
  document.getElementById('myClientsToggle').addEventListener('change', (e) => { myClientsOnly = e.target.checked; render(); });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const rows = visibleClients();
    const data = rows.map(c => ({
      Name: c.name,
      Status: statusLabel(c.status),
      'Due Date': c.due_date || '',
      'Assigned To': profilesMap[c.assigned_to] || '',
      'Last Updated': c.updated_at || '',
      'Updated By': profilesMap[c.updated_by] || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Clients');
    XLSX.writeFile(wb, `fintrack-clients-${new Date().toISOString().slice(0,10)}.xlsx`);
  });

  document.getElementById('importExcelBtn').addEventListener('click', async () => {
    if (!isAdmin()) { alert('Only Admin can import clients from Excel.'); return; }
    const fileInput = document.getElementById('excelFile');
    const errEl = document.getElementById('excelError');
    errEl.textContent = '';
    const file = fileInput.files[0];
    if (!file) { errEl.textContent = 'Choose an Excel file first.'; return; }
    const assignedTo = document.getElementById('excelAssigned').value || null;

    let rows;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      rows = json.map(r => {
        const nameKey = Object.keys(r).find(k => k.trim().toLowerCase() === 'name');
        const dueKey = Object.keys(r).find(k => ['due_date', 'due date', 'duedate'].includes(k.trim().toLowerCase()));
        const name = nameKey ? String(r[nameKey]).trim() : '';
        let due = dueKey ? r[dueKey] : '';
        if (due instanceof Date) due = due.toISOString().slice(0, 10);
        else due = due ? String(due).trim() : '';
        return name ? {
          name, due_date: due || null, status: 'blue', assigned_to: assignedTo,
          updated_by: currentUser.id, updated_at: new Date().toISOString()
        } : null;
      }).filter(Boolean);
    } catch (e) {
      errEl.textContent = 'Could not read Excel file: ' + e.message;
      return;
    }
    if (!rows || rows.length === 0) { errEl.textContent = 'No valid rows found — make sure there is a "name" column.'; return; }

    const btn = document.getElementById('importExcelBtn');
    btn.disabled = true; btn.textContent = 'Importing...';
    const { error } = await sb.from('clients').insert(rows);
    btn.disabled = false; btn.textContent = 'Import';

    if (error) { errEl.textContent = 'Import failed: ' + error.message; return; }
    showToast(`Imported ${rows.length} client${rows.length > 1 ? 's' : ''}${assignedTo ? ' and assigned to ' + (profilesMap[assignedTo] || 'staff') : ''}.`);
    closeClientModal();
    await loadClients();
  });

  document.getElementById('navToggle').addEventListener('click', () => {
    const sidebar = document.getElementById('navSidebar');
    sidebar.classList.toggle('collapsed');
    document.getElementById('navToggle').textContent = sidebar.classList.contains('collapsed') ? '»' : '«';
  });
  document.getElementById('tabBoard').addEventListener('click', () => switchTab('board'));
  document.getElementById('tabOverview').addEventListener('click', () => switchTab('overview'));
  function switchTab(tab){
    document.getElementById('boardView').style.display = tab === 'board' ? 'block' : 'none';
    document.getElementById('overviewView').style.display = tab === 'overview' ? 'block' : 'none';
    document.getElementById('tabBoard').classList.toggle('active', tab === 'board');
    document.getElementById('tabOverview').classList.toggle('active', tab === 'overview');
  }

  function renderOverview(){
    const counts = { blue: 0, red: 0, green: 0 };
    clients.forEach(c => counts[c.status]++);

    const oldestRed = clients.filter(c => c.status === 'red')
      .sort((a, b) => new Date(a.updated_at) - new Date(b.updated_at)).slice(0, 8);

    const workload = staffList.map(p => {
      const assigned = clients.filter(c => c.assigned_to === p.id);
      return { name: p.full_name, total: assigned.length, red: assigned.filter(c => c.status === 'red').length };
    }).sort((a, b) => b.red - a.red || b.total - a.total);

    document.getElementById('overviewView').innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="num" style="color:var(--blue)">${counts.blue}</div><div class="label">In Progress</div></div>
        <div class="stat-card"><div class="num" style="color:var(--red)">${counts.red}</div><div class="label">Delayed 1 month</div></div>
        <div class="stat-card"><div class="num" style="color:var(--green)">${counts.green}</div><div class="label">Completed</div></div>
      </div>
      <div class="panel">
        <h3>Longest-delayed clients</h3>
        ${oldestRed.length ? `<table><tr><th>Client</th><th>Delayed since</th><th>Assigned to</th></tr>
          ${oldestRed.map(c => `<tr><td>${escapeHtml(c.name)}</td><td>${timeAgo(c.updated_at)}</td><td>${escapeHtml(profilesMap[c.assigned_to] || 'Unassigned')}</td></tr>`).join('')}
        </table>` : '<div class="column-empty">No delayed clients right now.</div>'}
      </div>
      <div class="panel">
        <h3>Staff workload</h3>
        <table><tr><th>Staff</th><th>Assigned clients</th><th>Delayed</th></tr>
          ${workload.map(w => `<tr><td>${escapeHtml(w.name)}</td><td>${w.total}</td><td style="color:${w.red ? 'var(--red)' : 'inherit'}">${w.red}</td></tr>`).join('')}
        </table>
      </div>`;
  }

  function showToast(message){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }

  let audioCtx = null;
  function primeAudio(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  document.addEventListener('click', primeAudio, { once: true });
  function playAlarm(){
    try {
      primeAudio();
      const now = audioCtx.currentTime;
      [880, 660].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.25, now + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.16);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.18);
      });
    } catch (e) {}
  }
  function showRedAlert(client){
    const stack = document.getElementById('alertStack');
    const el = document.createElement('div');
    el.className = 'alert';
    el.innerHTML = `<span class="dot"></span><span class="alert-text"><b>${escapeHtml(client.name)}</b> just moved to Delayed 1 month.</span><button>Got it</button>`;
    el.querySelector('button').addEventListener('click', () => el.remove());
    stack.appendChild(el);
    playAlarm();
  }

  function setupRealtime(){
    sb.channel('clients-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'clients' }, (payload) => {
        showToast(`New client added: ${payload.new.name}`);
        loadClients();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'clients' }, (payload) => {
        loadClients();
        if (payload.new.status === 'red' && payload.old.status !== 'red') showRedAlert(payload.new);
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'clients' }, () => loadClients())
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'client_notes' }, (payload) => {
        if (openDetailId === payload.new.client_id) loadNotes(openDetailId);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'deleted_clients' }, () => loadDeletedClients())
      .subscribe();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    currentUser = session.user;

    const { data: profile } = await sb.from('profiles').select('full_name, role').eq('id', currentUser.id).single();
    if (!profile || !['staff', 'head'].includes(profile.role)) {
      await sb.auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    currentProfile = profile;
    document.getElementById('userName').textContent = profile.full_name;
    document.getElementById('userRole').textContent = profile.role === 'head' ? 'Admin' : 'Staff';
    if (profile.role === 'head') {
      document.getElementById('tabOverview').style.display = 'flex';
      document.body.classList.add('admin-view');
    } else {
      document.body.classList.add('staff-view');
    }

    updateSortLabel();
    showToast(`Welcome, ${profile.full_name}! 👋`);
    setupRealtime();

    await loadProfiles();
    await loadClients();
    await loadDeletedClients();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
</script>
</body>
</html>
